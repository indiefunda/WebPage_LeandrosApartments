name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Type-check and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Astro + TypeScript diagnostics
        run: npm run check

      - name: Prettier
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Upload static build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
