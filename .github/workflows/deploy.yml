name: Deploy to Firebase Hosting

# Manual trigger only: production deploys are intentional.
# Add a repository secret named FIREBASE_SERVICE_ACCOUNT containing the JSON
# key of a service account with the "Firebase Hosting Admin" role, then run
# this workflow from the Actions tab.
on:
  workflow_dispatch:

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: leandros-apartments
          channelId: live
